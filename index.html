<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(160deg, #1b2234 0%, #2d3752 45%, #4a4063 100%);
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.22);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      padding: 44px 20px 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 画面切り替え制御 */
    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }
    .screen.active {
      display: flex;
    }

    /* ロック画面：時計・日付 */
    .clock-area {
      text-align: center;
      margin-top: 12px;
      margin-bottom: 24px;
    }
    .date-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .time-text {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    /* ロック画面：通知カード */
    .widget-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .widget-body {
      font-size: 14px;
      line-height: 1.45;
    }

    /* ロック画面：アプリアイコングリッド */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 12px;
      margin-top: auto;
      padding-top: 24px;
    }
    .app-btn {
      background: none;
      border: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .app-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: transform 0.12s ease;
    }
    .app-btn:active .app-icon {
      transform: scale(0.92);
    }
    .app-label {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* サブ画面共通ヘッダー */
    .sub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .back-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    .sub-title {
      font-size: 16px;
      font-weight: 700;
    }
    .placeholder-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* LINE：トーク一覧 */
    .talk-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .talk-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      color: var(--text-main);
      width: 100%;
    }
    .talk-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    .talk-info {
      flex: 1;
      min-width: 0;
    }
    .talk-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .talk-name {
      font-size: 15px;
      font-weight: 700;
    }
    .talk-time {
      font-size: 11px;
      color: var(--text-sub);
    }
    .talk-preview {
      font-size: 13px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* LINE：個別トーク */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 2px 12px;
    }
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }
    .msg-row.partner {
      align-self: flex-start;
    }
    .msg-row.me {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-row.partner .msg-bubble {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid var(--glass-border);
      border-top-left-radius: 4px;
    }
    .msg-row.me .msg-bubble {
      background: rgba(120, 210, 160, 0.35);
      border: 1px solid rgba(150, 240, 190, 0.45);
      border-top-right-radius: 4px;
    }
    .msg-meta {
      font-size: 10px;
      color: var(--text-sub);
      margin-top: 3px;
      padding: 0 4px;
    }

    /* 下部入力欄（共通） */
    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 10px 16px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      min-width: 0;
    }
    .chat-input::placeholder {
      color: var(--text-sub);
    }
    .send-btn {
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-radius: 999px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn:active {
      transform: scale(0.95);
    }

    /* X：タイムライン */
    .x-feed {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 12px;
    }
    .x-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      gap: 10px;
    }
    .x-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .x-body-wrap {
      flex: 1;
      min-width: 0;
    }
    .x-author-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .x-author {
      font-size: 14px;
      font-weight: 700;
    }
    .x-time {
      font-size: 11px;
      color: var(--text-sub);
    }
    .x-text {
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
    }
    .x-actions {
      display: flex;
      gap: 12px;
    }
    .x-action-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-sub);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .x-replies {
      margin-top: 8px;
      padding-left: 10px;
      border-left: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .x-reply-item {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    /* set log：エピソード一覧 */
    .log-ep-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .log-ep-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      text-align: left;
      color: var(--text-main);
      width: 100%;
    }
    .log-ep-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .log-ep-meta {
      font-size: 12px;
      color: var(--text-sub);
    }
    .log-badge {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      flex-shrink: 0;
    }

    /* set log：シーンカード詳細（Muse風フォトログ枠） */
    .log-detail-meta {
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .log-detail-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .log-detail-title {
      font-size: 17px;
      font-weight: 700;
    }
    .log-detail-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .scene-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 12px;
    }
    .scene-card {
      position: relative;
      height: 190px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--glass-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      flex-shrink: 0;
    }
    .scene-card.has-bg {
      background-size: cover;
      background-position: center;
    }
    .scene-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
    }
    .scene-top, .scene-center {
      position: relative;
      z-index: 1;
    }
    .scene-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scene-speaker-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }
    .scene-speaker-name {
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .scene-center {
      text-align: center;
      margin: auto 0;
      padding: 0 8px;
    }
    .scene-time {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      margin-bottom: 6px;
    }
    .scene-line {
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 1px 6px rgba(0,0,0,0.75);
      line-height: 1.4;
    }
    .speaker-select {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 0 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      flex-shrink: 0;
    }
    .speaker-select option {
      background: #2d3752;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="phone-frame">

    <!-- 1. ロック画面（ホームハブ） -->
    <div id="screen-lock" class="screen active">
      <div>
        <div class="clock-area">
          <div id="date-display" class="date-text">11月20日 金曜日</div>
          <div id="time-display" class="time-text">09:00</div>
        </div>

        <div class="widget-card" onclick="openChat('leo')">
          <div class="widget-header">
            <span>💬 LINE ・ たった今</span>
            <span>れお</span>
          </div>
          <div id="lock-line-preview" class="widget-body">
            おはよ。今日も無理しすぎないようにね。
          </div>
        </div>

        <div class="widget-card" onclick="openScreen('screen-x')">
          <div class="widget-header">
            <span>𝕏 タイムライン</span>
            <span>新着あり</span>
          </div>
          <div id="lock-x-preview" class="widget-body">
            最近のつぶやきや巡回ログがここに表示されます。
          </div>
        </div>
      </div>

      <div class="app-grid">
        <button class="app-btn" onclick="openScreen('screen-line-list')">
          <div class="app-icon">💬</div>
          <span class="app-label">LINE</span>
        </button>
        <button class="app-btn" onclick="openScreen('screen-x')">
          <div class="app-icon">𝕏</div>
          <span class="app-label">X</span>
        </button>
        <button class="app-btn" onclick="openScreen('screen-log-list')">
          <div class="app-icon">📓</div>
          <span class="app-label">set log</span>
        </button>
        <button class="app-btn" onclick="openScreen('screen-settings')">
          <div class="app-icon">⚙️</div>
          <span class="app-label">設定</span>
        </button>
      </div>
    </div>

    <!-- 2-A. LINE：トーク一覧画面 -->
    <div id="screen-line-list" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">トーク</div>
        <div style="width: 72px;"></div>
      </div>

      <div id="talk-list-container" class="talk-list"></div>
    </div>

    <!-- 2-B. LINE：個別チャット画面 -->
    <div id="screen-line-chat" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-line-list')">← 一覧</button>
        <div id="chat-partner-name" class="sub-title">れお</div>
        <button class="back-btn" onclick="clearCurrentChat()" style="font-size: 11px;">履歴消去</button>
      </div>

      <div id="chat-messages" class="chat-messages"></div>

      <div class="chat-input-bar">
        <input
          id="chat-input"
          class="chat-input"
          type="text"
          placeholder="メッセージを入力..."
          onkeydown="if(event.key==='Enter') sendMessage()"
        />
        <button class="send-btn" onclick="sendMessage()">送信</button>
      </div>
    </div>

    <!-- 3. X風タイムライン画面 -->
    <div id="screen-x" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">タイムライン</div>
        <button class="back-btn" onclick="addDummyPatrolPost()" style="font-size: 11px;">+ 巡回(仮)</button>
      </div>

      <div id="x-feed" class="x-feed"></div>

      <div class="chat-input-bar">
        <input
          id="x-input"
          class="chat-input"
          type="text"
          placeholder="いま何してる？"
          onkeydown="if(event.key==='Enter') postTweet()"
        />
        <button class="send-btn" onclick="postTweet()">投稿</button>
      </div>
    </div>

    <!-- 4-A. set log：エピソード一覧画面 -->
    <div id="screen-log-list" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">set log</div>
        <button class="back-btn" onclick="createNewLogEpisode()" style="font-size: 11px;">+ 新規</button>
      </div>

      <div id="log-ep-list" class="log-ep-list"></div>
    </div>

    <!-- 4-B. set log：シーン詳細画面（Museフォトログ風） -->
    <div id="screen-log-detail" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-log-list')">← 一覧</button>
        <div class="sub-title">log</div>
        <button id="log-status-btn" class="back-btn" onclick="toggleLogStatus()" style="font-size: 11px;">進行中</button>
      </div>

      <div class="log-detail-meta">
        <div class="log-detail-title-row">
          <div id="log-detail-title" class="log-detail-title">雨のソラマチと水族館デート</div>
        </div>
        <div id="log-detail-sub" class="log-detail-sub">れお ・ 11月15日（日）</div>
      </div>

      <div id="scene-list" class="scene-list"></div>

      <div class="chat-input-bar">
        <select id="scene-speaker-select" class="speaker-select">
          <option value="れお">れお</option>
          <option value="自分">自分</option>
        </select>
        <input
          id="scene-input"
          class="chat-input"
          type="text"
          placeholder="シーンのセリフを入力..."
          onkeydown="if(event.key==='Enter') addSceneCard()"
        />
        <button class="send-btn" onclick="addSceneCard()">追加</button>
      </div>
    </div>

    <!-- 5. 設定画面 -->
    <div id="screen-settings" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">設定</div>
        <div style="width: 72px;"></div>
      </div>
      <div class="placeholder-box">
        ここにキャラクター設定やプロンプト・API設定などを置いていきます。
      </div>
    </div>

  </div>

  <script>
    // 時計と日付をリアルタイム更新
    function updateClock() {
      const now = new Date();
      const days = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayName = days[now.getDay()];
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");

      document.getElementById("date-display").textContent = `${month}月${date}日 ${dayName}`;
      document.getElementById("time-display").textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function getCurrentTimeStr() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 画面切り替え
    function openScreen(screenId) {
      document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
      document.getElementById(screenId).classList.add("active");
      if (screenId === "screen-line-list") renderTalkList();
      if (screenId === "screen-x") renderXFeed();
      if (screenId === "screen-log-list") renderLogEpisodes();
    }

    // --- LINE機能 ---
    const characters = {
      leo: {
        name: "れお",
        icon: "れ",
        initialMessage: "おはよ。今日も無理しすぎないようにね。"
      },
      sub1: {
        name: "キャラB（仮）",
        icon: "B",
        initialMessage: "テスト用のトーク枠だよ。"
      }
    };

    let currentPartnerId = "leo";
    let chatData = JSON.parse(localStorage.getItem("my_space_line_chats") || "null") || {
      leo: [{ sender: "partner", text: characters.leo.initialMessage, time: "09:00" }],
      sub1: [{ sender: "partner", text: characters.sub1.initialMessage, time: "08:30" }]
    };

    function saveChats() {
      localStorage.setItem("my_space_line_chats", JSON.stringify(chatData));
      renderTalkList();
    }

    function renderTalkList() {
      const container = document.getElementById("talk-list-container");
      container.innerHTML = "";

      Object.keys(characters).forEach((id) => {
        const char = characters[id];
        const msgs = chatData[id] || [];
        const lastMsg = msgs[msgs.length - 1];

        const btn = document.createElement("button");
        btn.className = "talk-item";
        btn.onclick = () => openChat(id);
        btn.innerHTML = `
          <div class="talk-avatar">${char.icon}</div>
          <div class="talk-info">
            <div class="talk-top">
              <span class="talk-name">${char.name}</span>
              <span class="talk-time">${lastMsg ? lastMsg.time : ""}</span>
            </div>
            <div class="talk-preview">${lastMsg ? escapeHtml(lastMsg.text) : ""}</div>
          </div>
        `;
        container.appendChild(btn);
      });

      const leoMsgs = chatData.leo || [];
      if (leoMsgs.length > 0) {
        document.getElementById("lock-line-preview").textContent = leoMsgs[leoMsgs.length - 1].text;
      }
    }

    function openChat(partnerId) {
      currentPartnerId = partnerId;
      document.getElementById("chat-partner-name").textContent = characters[partnerId].name;
      openScreen("screen-line-chat");
      renderMessages();
    }

    function renderMessages() {
      const box = document.getElementById("chat-messages");
      box.innerHTML = "";
      const msgs = chatData[currentPartnerId] || [];

      msgs.forEach((m) => {
        const row = document.createElement("div");
        row.className = `msg-row ${m.sender}`;
        row.innerHTML = `
          <div class="msg-bubble">${escapeHtml(m.text)}</div>
          <div class="msg-meta">${m.time}</div>
        `;
        box.appendChild(row);
      });

      box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;

      const timeStr = getCurrentTimeStr();
      if (!chatData[currentPartnerId]) chatData[currentPartnerId] = [];
      chatData[currentPartnerId].push({ sender: "me", text, time: timeStr });
      input.value = "";
      saveChats();
      renderMessages();

      const targetId = currentPartnerId;
      setTimeout(() => {
        const replyText = `（仮返信）『${text}』受け取ったよ！`;
        chatData[targetId].push({ sender: "partner", text: replyText, time: getCurrentTimeStr() });
        saveChats();
        if (currentPartnerId === targetId) {
          renderMessages();
        }
      }, 700);
    }

    function clearCurrentChat() {
      const char = characters[currentPartnerId];
      chatData[currentPartnerId] = [
        { sender: "partner", text: char.initialMessage, time: getCurrentTimeStr() }
      ];
      saveChats();
      renderMessages();
    }

    // --- X（タイムライン）機能 ---
    let xPosts = JSON.parse(localStorage.getItem("my_space_x_posts") || "null") || [
      {
        id: 1,
        author: "れお",
        icon: "れ",
        text: "朝の空気ちょっとひんやりしてるね。温かい飲み物ある？",
        time: "08:45",
        likes: 1,
        replies: ["（仮リプ）れお：いいね、ちょっとほっと一息つこ。"]
      }
    ];

    function saveXPosts() {
      localStorage.setItem("my_space_x_posts", JSON.stringify(xPosts));
      renderXFeed();
      if (xPosts.length > 0) {
        document.getElementById("lock-x-preview").textContent = `${xPosts[0].author}：${xPosts[0].text}`;
      }
    }

    function postTweet() {
      const input = document.getElementById("x-input");
      const text = input.value.trim();
      if (!text) return;

      const newPost = {
        id: Date.now(),
        author: "自分",
        icon: "自",
        text,
        time: getCurrentTimeStr(),
        likes: 0,
        replies: []
      };
      xPosts.unshift(newPost);
      input.value = "";
      saveXPosts();

      setTimeout(() => {
        const target = xPosts.find((p) => p.id === newPost.id);
        if (target) {
          target.likes += 1;
          target.replies.push(`（仮リプ）れお：『${text}』に反応したよ！`);
          saveXPosts();
        }
      }, 800);
    }

    function addDummyPatrolPost() {
      const samples = [
        "なんか急に甘いものか炭酸が飲みたい気分かも。",
        "さっきまで静かだったのに、急に画面が賑やかになってきた。",
        "今日ちょっとペース早いかも？呼吸整えよう。"
      ];
      const pick = samples[Math.floor(Math.random() * samples.length)];
      xPosts.unshift({
        id: Date.now(),
        author: "れお",
        icon: "れ",
        text: `（巡回テスト）${pick}`,
        time: getCurrentTimeStr(),
        likes: 0,
        replies: []
      });
      saveXPosts();
    }

    function likePost(id) {
      const post = xPosts.find((p) => p.id === id);
      if (post) {
        post.likes += 1;
        saveXPosts();
      }
    }

    function renderXFeed() {
      const feed = document.getElementById("x-feed");
      feed.innerHTML = "";

      xPosts.forEach((p) => {
        const card = document.createElement("div");
        card.className = "x-card";

        const repliesHtml = (p.replies || []).length
          ? `<div class="x-replies">${p.replies.map((r) => `<div class="x-reply-item">${escapeHtml(r)}</div>`).join("")}</div>`
          : "";

        card.innerHTML = `
          <div class="x-avatar">${escapeHtml(p.icon)}</div>
          <div class="x-body-wrap">
            <div class="x-author-row">
              <span class="x-author">${escapeHtml(p.author)}</span>
              <span class="x-time">${escapeHtml(p.time)}</span>
            </div>
            <div class="x-text">${escapeHtml(p.text)}</div>
            <div class="x-actions">
              <button class="x-action-btn" onclick="likePost(${p.id})">♡ ${p.likes}</button>
            </div>
            ${repliesHtml}
          </div>
        `;
        feed.appendChild(card);
      });
    }

    // --- set log（Muse風フォトログ骨組み） ---
    let logEpisodes = JSON.parse(localStorage.getItem("my_space_set_logs") || "null") || [
      {
        id: "ep1",
        title: "雨のソラマチと水族館デート",
        partner: "れお",
        date: "11月15日（日）",
        status: "おわり",
        scenes: [
          { speaker: "れお", time: "16:31", text: "暗いからな、手離すなよ" },
          { speaker: "自分", time: "16:31", text: "くらげ、きれい…♡" }
        ]
      }
    ];
    let currentEpisodeId = "ep1";

    function saveLogs() {
      localStorage.setItem("my_space_set_logs", JSON.stringify(logEpisodes));
    }

    function renderLogEpisodes() {
      const list = document.getElementById("log-ep-list");
      list.innerHTML = "";

      logEpisodes.forEach((ep) => {
        const btn = document.createElement("button");
        btn.className = "log-ep-card";
        btn.onclick = () => openLogDetail(ep.id);
        btn.innerHTML = `
          <div>
            <div class="log-ep-title">${escapeHtml(ep.title)}</div>
            <div class="log-ep-meta">${escapeHtml(ep.partner)} ・ ${escapeHtml(ep.date)}（${ep.scenes.length}シーン）</div>
          </div>
          <span class="log-badge">${escapeHtml(ep.status)}</span>
        `;
        list.appendChild(btn);
      });
    }

    function createNewLogEpisode() {
      const title = prompt("エピソードのタイトルを入力してください", "新しいお出かけログ");
      if (!title) return;
      const now = new Date();
      const dateStr = `${now.getMonth() + 1}月${now.getDate()}日`;
      const newEp = {
        id: "ep_" + Date.now(),
        title: title.trim(),
        partner: "れお",
        date: dateStr,
        status: "進行中",
        scenes: [
          { speaker: "れお", time: getCurrentTimeStr(), text: "待ち合わせ場所、着いたよ。" }
        ]
      };
      logEpisodes.unshift(newEp);
      saveLogs();
      openLogDetail(newEp.id);
    }

    function openLogDetail(epId) {
      currentEpisodeId = epId;
      const ep = logEpisodes.find((e) => e.id === epId);
      if (!ep) return;

      document.getElementById("log-detail-title").textContent = ep.title;
      document.getElementById("log-detail-sub").textContent = `${ep.partner} ・ ${ep.date}`;
      document.getElementById("log-status-btn").textContent = ep.status;
      openScreen("screen-log-detail");
      renderScenes();
    }

    function toggleLogStatus() {
      const ep = logEpisodes.find((e) => e.id === currentEpisodeId);
      if (!ep) return;
      ep.status = ep.status === "おわり" ? "進行中" : "おわり";
      document.getElementById("log-status-btn").textContent = ep.status;
      saveLogs();
    }

    function renderScenes() {
      const container = document.getElementById("scene-list");
      container.innerHTML = "";
      const ep = logEpisodes.find((e) => e.id === currentEpisodeId);
      if (!ep) return;

      ep.scenes.forEach((sc) => {
        const card = document.createElement("div");
        card.className = "scene-card";
        const initial = sc.speaker.slice(0, 1);
        card.innerHTML = `
          <div class="scene-top">
            <div class="scene-speaker-icon">${escapeHtml(initial)}</div>
            <div class="scene-speaker-name">${escapeHtml(sc.speaker)}</div>
          </div>
          <div class="scene-center">
            <div class="scene-time">${escapeHtml(sc.time)}</div>
            <div class="scene-line">${escapeHtml(sc.text)}</div>
          </div>
          <div style="height: 16px;"></div>
        `;
        container.appendChild(card);
      });

      container.scrollTop = container.scrollHeight;
    }

    function addSceneCard() {
      const ep = logEpisodes.find((e) => e.id === currentEpisodeId);
      const speaker = document.getElementById("scene-speaker-select").value;
      const input = document.getElementById("scene-input");
      const text = input.value.trim();
      if (!ep || !text) return;

      ep.scenes.push({
        speaker,
        time: getCurrentTimeStr(),
        text
      });
      input.value = "";
      saveLogs();
      renderScenes();
    }

    renderTalkList();
    renderXFeed();
    renderLogEpisodes();
    if (xPosts.length > 0) {
      document.getElementById("lock-x-preview").textContent = `${xPosts[0].author}：${xPosts[0].text}`;
    }
  </script>
</body>
</html>
