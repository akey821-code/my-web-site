<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>My Space</title>
<style>
:root{--bg:linear-gradient(160deg,#1b2234 0%,#2d3752 45%,#4a4063 100%);--glass:rgba(255,255,255,0.14);--border:rgba(255,255,255,0.22);--text:#fff;--sub:rgba(255,255,255,0.78)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
.phone-frame{width:100%;max-width:430px;height:100dvh;padding:44px 20px 24px;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;flex-direction:column;min-height:0}.screen.active{display:flex}
.clock-area{text-align:center;margin:12px 0 24px}.date-text{font-size:16px;color:var(--sub);margin-bottom:4px}.time-text{font-size:72px;font-weight:700;line-height:1}
.widget-card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.widget-header{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:4px}.widget-body{font-size:14px;line-height:1.45}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 12px;margin-top:auto;padding-top:24px}
.app-btn{background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.app-icon{width:58px;height:58px;border-radius:16px;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px}
.app-label{font-size:11px;color:var(--sub)}
.sub-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-shrink:0}
.back-btn{background:var(--glass);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.sub-title{font-size:16px;font-weight:700}
.talk-list,.x-feed,.log-ep-list,.scene-list,.settings-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.talk-item,.log-ep-card{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--text);width:100%}
.log-ep-card{justify-content:space-between}
.avatar-circle{border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
.avatar-circle img{width:100%;height:100%;object-fit:cover;display:block}
.talk-info,.x-body-wrap{flex:1;min-width:0}
.talk-top,.x-author-row{display:flex;justify-content:space-between;margin-bottom:4px}
.talk-name,.x-author,.log-ep-title{font-size:15px;font-weight:700}
.talk-time,.x-time,.log-ep-meta{font-size:11px;color:var(--sub)}
.talk-preview{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px}
.msg-row{display:flex;flex-direction:column;max-width:78%}.msg-row.partner{align-self:flex-start}.msg-row.me{align-self:flex-end;align-items:flex-end}
.msg-bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.msg-row.partner .msg-bubble{background:rgba(255,255,255,0.18);border:1px solid var(--border);border-top-left-radius:4px}
.msg-row.me .msg-bubble{background:rgba(120,210,160,0.35);border:1px solid rgba(150,240,190,0.45);border-top-right-radius:4px}
.msg-meta{font-size:10px;color:var(--sub);margin-top:3px;padding:0 4px}
.chat-input-bar{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input{flex:1;background:rgba(255,255,255,0.16);border:1px solid var(--border);border-radius:999px;padding:10px 16px;color:var(--text);font-size:15px;outline:none;min-width:0}
.chat-input::placeholder{color:var(--sub)}
.send-btn{background:rgba(255,255,255,0.28);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:0 16px;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
.x-card{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;gap:10px}
.x-text{font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
.x-action-btn,.log-badge,.mini-btn{background:rgba(255,255,255,0.16);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:5px 11px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mini-btn.danger{background:rgba(220,80,80,0.3)}
.x-replies{margin-top:8px;padding-left:10px;border-left:2px solid rgba(255,255,255,0.25);display:flex;flex-direction:column;gap:4px}
.x-reply-item{font-size:12px;color:var(--sub)}
.log-detail-meta{margin-bottom:10px;flex-shrink:0}.log-detail-title{font-size:17px;font-weight:700}.log-detail-sub{font-size:12px;color:var(--sub)}
.scene-card{position:relative;height:185px;border-radius:18px;background:rgba(255,255,255,0.12);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:14px;flex-shrink:0}
.scene-top{display:flex;align-items:center;gap:8px}
.scene-speaker-name{font-size:13px;font-weight:700}
.scene-center{text-align:center;margin:auto 0}.scene-time{font-size:34px;font-weight:700;line-height:1.1;margin-bottom:6px}.scene-line{font-size:14px;font-weight:600}
.speaker-select{background:rgba(255,255,255,0.16);border:1px solid var(--border);border-radius:999px;padding:0 10px;color:var(--text);font-size:13px;outline:none}
.speaker-select option{background:#2d3752;color:#fff}
.settings-section{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.settings-sec-header,.char-card-top{display:flex;justify-content:space-between;align-items:center}
.settings-sec-title{font-size:14px;font-weight:700}
.field-label{font-size:11px;color:var(--sub);margin-bottom:4px;display:block}
.settings-input,.settings-textarea{width:100%;background:rgba(255,255,255,0.12);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.settings-textarea{min-height:70px;resize:vertical}
.avatar-picker-row{display:flex;align-items:center;gap:12px}
.char-card{background:rgba(0,0,0,0.18);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.save-toast{font-size:12px;color:#a8f0c6;text-align:center;min-height:16px}
</style>
</head>
<body>
<div class="phone-frame">
  <div id="screen-lock" class="screen active">
    <div>
      <div class="clock-area"><div id="date-display" class="date-text"></div><div id="time-display" class="time-text"></div></div>
      <div class="widget-card" onclick="openFirstChat()">
        <div class="widget-header"><span>💬 LINE ・ たった今</span><span id="lock-line-sender">れお</span></div>
        <div id="lock-line-preview" class="widget-body">おはよ。今日も無理しすぎないようにね。</div>
      </div>
      <div class="widget-card" onclick="openScreen('screen-x')">
        <div class="widget-header"><span>𝕏 タイムライン</span><span>新着あり</span></div>
        <div id="lock-x-preview" class="widget-body">最近のつぶやきが表示されます。</div>
      </div>
    </div>
    <div class="app-grid">
      <button class="app-btn" onclick="openScreen('screen-line-list')"><div class="app-icon">💬</div><span class="app-label">LINE</span></button>
      <button class="app-btn" onclick="openScreen('screen-x')"><div class="app-icon">𝕏</div><span class="app-label">X</span></button>
      <button class="app-btn" onclick="openScreen('screen-log-list')"><div class="app-icon">📓</div><span class="app-label">set log</span></button>
      <button class="app-btn" onclick="openScreen('screen-settings')"><div class="app-icon">⚙️</div><span class="app-label">設定</span></button>
    </div>
  </div>

  <div id="screen-line-list" class="screen">
    <div class="sub-header"><button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button><div class="sub-title">トーク</div><div style="width:72px"></div></div>
    <div id="talk-list-container" class="talk-list"></div>
  </div>

  <div id="screen-line-chat" class="screen">
    <div class="sub-header"><button class="back-btn" onclick="openScreen('screen-line-list')">← 一覧</button><div id="chat-partner-name" class="sub-title">れお</div><button class="back-btn" onclick="clearCurrentChat()" style="font-size:11px">履歴消去</button></div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-bar">
      <input id="chat-input" class="chat-input" type="text" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter')sendMessage()" />
      <button class="send-btn" onclick="sendMessage()">送信</button>
    </div>
  </div>

  <div id="screen-x" class="screen">
    <div class="sub-header"><button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button><div class="sub-title">タイムライン</div><button class="back-btn" onclick="addDummyPatrolPost()" style="font-size:11px">+ 巡回(仮)</button></div>
    <div id="x-feed" class="x-feed"></div>
    <div class="chat-input-bar">
      <input id="x-input" class="chat-input" type="text" placeholder="いま何してる？" onkeydown="if(event.key==='Enter')postTweet()" />
      <button class="send-btn" onclick="postTweet()">投稿</button>
    </div>
  </div>

  <div id="screen-log-list" class="screen">
    <div class="sub-header"><button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button><div class="sub-title">set log</div><button class="back-btn" onclick="createNewLogEpisode()" style="font-size:11px">+ 新規</button></div>
    <div id="log-ep-list" class="log-ep-list"></div>
  </div>

  <div id="screen-log-detail" class="screen">
    <div class="sub-header"><button class="back-btn" onclick="openScreen('screen-log-list')">← 一覧</button><div class="sub-title">log</div><button id="log-status-btn" class="back-btn" onclick="toggleLogStatus()" style="font-size:11px">進行中</button></div>
    <div class="log-detail-meta"><div id="log-detail-title" class="log-detail-title"></div><div id="log-detail-sub" class="log-detail-sub"></div></div>
    <div id="scene-list" class="scene-list"></div>
    <div class="chat-input-bar">
      <select id="scene-speaker-select" class="speaker-select"></select>
      <input id="scene-input" class="chat-input" type="text" placeholder="シーンのセリフを入力..." onkeydown="if(event.key==='Enter')addSceneCard()" />
      <button class="send-btn" onclick="addSceneCard()">追加</button>
    </div>
  </div>

  <div id="screen-settings" class="screen">
    <div class="sub-header"><button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button><div class="sub-title">設定</div><button class="back-btn" onclick="saveAllSettings()" style="font-weight:700">保存</button></div>
    <div id="settings-toast" class="save-toast"></div>
    <div class="settings-scroll">
      <div class="settings-section">
        <div class="settings-sec-header"><span class="settings-sec-title">自分のプロフィール</span></div>
        <div class="avatar-picker-row">
          <div id="set-user-avatar-preview" class="avatar-circle" style="width:48px;height:48px;font-size:16px">自</div>
          <div style="flex:1"><label class="field-label">表示名</label><input id="set-user-name" class="settings-input" type="text" /></div>
          <label class="mini-btn">写真選択<input type="file" accept="image/*" style="display:none" onchange="pickAvatarImage(event,'user',0)" /></label>
        </div>
        <div><label class="field-label">自分の設定メモ</label><textarea id="set-user-profile" class="settings-textarea" placeholder="呼び方や関係性など"></textarea></div>
      </div>
      <div class="settings-section">
        <div class="settings-sec-header"><span class="settings-sec-title">キャラクター管理</span><button class="mini-btn" onclick="addCharacterSlot()">+ キャラ追加</button></div>
        <div id="settings-char-list" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
      <div class="settings-section">
        <div class="settings-sec-header"><span class="settings-sec-title">世界観・共通ルール（正史要約など）</span></div>
        <div><label class="field-label">全体プロンプト土台</label><textarea id="set-world-rule" class="settings-textarea" placeholder="正史要約や共通ルールなど"></textarea></div>
      </div>
    </div>
  </div>
</div>

pullStateFromCloud();
<script>
function updateClock(){
  const n=new Date(),d=["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"];
  document.getElementById("date-display").textContent=`${n.getMonth()+1}月${n.getDate()}日 ${d[n.getDay()]}`;
  document.getElementById("time-display").textContent=`${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`;
}
updateClock();setInterval(updateClock,1000);
function nowStr(){const n=new Date();return `${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
const WORKER_URL = "https://my-space-api.akirinko821.workers.dev";
const nowTs = () => Date.now();

async function syncStateToCloud(patch = {}) {
try {
await fetch(`${WORKER_URL}/api/sync`, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(patch),
});
} catch (e) {
console.warn("syncStateToCloud error:", e);
}
}

async function pullStateFromCloud() {
try {
const res = await fetch(`${WORKER_URL}/api/sync`);
const data = await res.json();
if (!data?.ok) return;
let updated = false;
if (data.settings && Object.keys(data.settings).length) {
appSettings = { ...appSettings, ...data.settings };
localStorage.setItem("my_space_settings", JSON.stringify(appSettings));
updated = true;
}
if (data.lineChats && typeof data.lineChats === "object") {
chatData = data.lineChats;
localStorage.setItem("my_space_line_chats", JSON.stringify(chatData));
updated = true;
}
if (Array.isArray(data.xPosts)) {
xPosts = data.xPosts;
localStorage.setItem("my_space_x_posts", JSON.stringify(xPosts));
updated = true;
}
if (updated) {
renderTalkList();
renderXFeed();
renderLogEpisodes();
updateSpeakerOpts();
if (document.getElementById("screen-line-chat")?.classList.contains("active")) {
renderMsgs();
}
if (xPosts.length) {
document.getElementById("lock-x-preview").textContent = `${xPosts[0].author}：${xPosts[0].text}`;
}
}
} catch (e) {
console.warn("pullStateFromCloud error:", e);
}
}
const defSet={
  userName:"自分",userIcon:"自",userImg:"",userProfile:"",worldRule:"",
  characters:[
    {id:"leo",name:"れお",icon:"れ",img:"",initialMessage:"おはよ。今日も無理しすぎないようにね。",prompt:"優しく落ち着いた口調。距離感が近く気遣ってくれる。"},
    {id:"sub1",name:"キャラB（仮）",icon:"B",img:"",initialMessage:"テスト用のトーク枠だよ。",prompt:""}
  ]
};
let appSettings=JSON.parse(localStorage.getItem("my_space_settings")||"null")||defSet;
function charMap(){const m={};appSettings.characters.forEach(c=>m[c.id]=c);return m}
function avatarHtml(img,fallback,size=42,font=15){
  const inner=img?`<img src="${img}" />`:esc((fallback||"？").slice(0,1));
  return `<div class="avatar-circle" style="width:${size}px;height:${size}px;font-size:${font}px">${inner}</div>`;
}
function findAvatarByName(name){
  if(name===(appSettings.userName||"自分"))return avatarHtml(appSettings.userImg,name,26,12);
  const c=appSettings.characters.find(x=>x.name===name);
  return avatarHtml(c?.img||"",name,26,12);
}

function pickAvatarImage(ev,type,idx){
  const file=ev.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");canvas.width=120;canvas.height=120;
      const ctx=canvas.getContext("2d"),min=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,120,120);
      const dataUrl=canvas.toDataURL("image/jpeg",0.8);
      if(type==="user"){appSettings.userImg=dataUrl}
      else if(appSettings.characters[idx]){appSettings.characters[idx].img=dataUrl}
      syncSettings();renderSettings();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function openScreen(id){
  document.querySelectorAll(".screen").forEach(e=>e.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="screen-line-list")renderTalkList();
  if(id==="screen-x")renderXFeed();
  if(id==="screen-log-list")renderLogEpisodes();
  if(id==="screen-settings")renderSettings();
}

function renderSettings(){
  document.getElementById("set-user-name").value=appSettings.userName||"自分";
  document.getElementById("set-user-profile").value=appSettings.userProfile||"";
  document.getElementById("set-world-rule").value=appSettings.worldRule||"";
  const uPrev=document.getElementById("set-user-avatar-preview");
  uPrev.innerHTML=appSettings.userImg?`<img src="${appSettings.userImg}"/>`:esc((appSettings.userName||"自").slice(0,1));

  const list=document.getElementById("settings-char-list");list.innerHTML="";
  appSettings.characters.forEach((c,i)=>{
    const div=document.createElement("div");div.className="char-card";
    div.innerHTML=`
      <div class="char-card-top"><span style="font-size:12px;font-weight:700">キャラ ${i+1}</span>${appSettings.characters.length>1?`<button class="mini-btn danger" onclick="removeChar(${i})">削除</button>`:""}</div>
      <div class="avatar-picker-row">
        ${avatarHtml(c.img,c.name,44,15)}
        <div style="flex:1"><label class="field-label">名前</label><input class="settings-input c-name" data-i="${i}" value="${esc(c.name)}"/></div>
        <label class="mini-btn">写真選択<input type="file" accept="image/*" style="display:none" onchange="pickAvatarImage(event,'char',${i})"/></label>
      </div>
      <div><label class="field-label">性格・口調メモ（persona）</label><textarea class="settings-textarea c-prompt" data-i="${i}">${esc(c.prompt||"")}</textarea></div>`;
    list.appendChild(div);
  });
}
function syncSettings(){
  appSettings.userName=document.getElementById("set-user-name").value.trim()||"自分";
  appSettings.userIcon=appSettings.userName.slice(0,1);
  appSettings.userProfile=document.getElementById("set-user-profile").value;
  appSettings.worldRule=document.getElementById("set-world-rule").value;
  document.querySelectorAll(".c-name").forEach(e=>{if(appSettings.characters[e.dataset.i]){const n=e.value.trim()||"キャラ";appSettings.characters[e.dataset.i].name=n;appSettings.characters[e.dataset.i].icon=n.slice(0,1)}});
  document.querySelectorAll(".c-prompt").forEach(e=>{if(appSettings.characters[e.dataset.i])appSettings.characters[e.dataset.i].prompt=e.value});
}
function addCharacterSlot(){syncSettings();appSettings.characters.push({id:"c_"+Date.now(),name:"新キャラ",icon:"新",img:"",initialMessage:"よろしく。",prompt:""});renderSettings()}
function removeChar(i){syncSettings();if(appSettings.characters.length>1){appSettings.characters.splice(i,1);renderSettings()}}
function saveAllSettings(){
 syncSettings();
 localStorage.setItem("my_space_settings",JSON.stringify(appSettings));
 syncStateToCloud({ settings: appSettings });
 renderTalkList();updateSpeakerOpts();
 const t=document.getElementById("settings-toast");t.textContent="保存＆クラウド同期しました！";setTimeout(()=>t.textContent="",2000);
}

function sendMessage(){
 const inp=document.getElementById("chat-input"),txt=inp.value.trim();if(!txt)return;
 if(!chatData[curPartner])chatData[curPartner]=[];
 const tid=curPartner;
 chatData[tid].push({id:nowTs(),ts:nowTs(),sender:"me",text:txt,time:nowStr()});
 inp.value="";saveChats();renderMsgs();
 syncStateToCloud({ lineChats: chatData });

 const waitingId = nowTs() + 1;
 chatData[tid].push({id:waitingId,ts:nowTs(),sender:"partner",text:"…",time:nowStr()});
 if(curPartner===tid)renderMsgs();

 fetch(`${WORKER_URL}/api/generate`, {
 method: "POST",
 headers: { "Content-Type": "application/json" },
 body: JSON.stringify({ kind: "line_reply", mode: "private", targetText: txt }),
 })
 .then(r => r.json())
 .then(d => {
 const idx = (chatData[tid] || []).findIndex(m => m.id === waitingId);
 const replyText = d?.ok && d?.result?.text ? d.result.text : `（エラー）${d?.error || "返信に失敗しました"}`;
 if (idx !== -1) chatData[tid][idx].text = replyText;
 saveChats();
 if (curPartner === tid) renderMsgs();
 syncStateToCloud({ lineChats: chatData });
 })
 .catch(() => {
 const idx = (chatData[tid] || []).findIndex(m => m.id === waitingId);
 if (idx !== -1) chatData[tid][idx].text = "通信エラーになったよ。";
 saveChats();
 if (curPartner === tid) renderMsgs();
 });
}
function clearCurrentChat(){const c=charMap()[curPartner];chatData[curPartner]=[{sender:"partner",text:c?.initialMessage||"こんにちは。",time:nowStr()}];saveChats();renderMsgs()}

let xPosts=JSON.parse(localStorage.getItem("my_space_x_posts")||"null")||[{id:1,author:"れお",icon:"れ",text:"朝の空気ちょっとひんやりしてるね。温かい飲み物ある？",time:"08:45",likes:1,replies:["（仮リプ）れお：いいね、ちょっとほっと一息つこ。"]}];
function saveX(){localStorage.setItem("my_space_x_posts",JSON.stringify(xPosts));renderXFeed();if(xPosts.length)document.getElementById("lock-x-preview").textContent=`${xPosts[0].author}：${xPosts[0].text}`}
function postTweet(){
  const inp=document.getElementById("x-input"),txt=inp.value.trim();if(!txt)return;
  const p={id:Date.now(),author:appSettings.userName||"自分",icon:appSettings.userIcon||"自",text:txt,time:nowStr(),likes:0,replies:[]};
  xPosts.unshift(p);inp.value="";saveX();
  const fc=appSettings.characters[0];
  setTimeout(()=>{const t=xPosts.find(x=>x.id===p.id);if(t&&fc){t.likes++;t.replies.push(`（仮リプ）${fc.name}：『${txt}』に反応したよ！`);saveX()}},800);
}
function addDummyPatrolPost(){
  const cs=appSettings.characters,c=cs[Math.floor(Math.random()*cs.length)]||{name:"れお",icon:"れ"};
  const s=["なんか急に甘いものか炭酸が飲みたい気分かも。","さっきまで静かだったのに、急に画面が賑やかになってきた。","今日ちょっとペース早いかも？呼吸整えよう。"];
  xPosts.unshift({id:Date.now(),author:c.name,icon:c.icon,text:`（巡回テスト）${s[Math.floor(Math.random()*s.length)]}`,time:nowStr(),likes:0,replies:[]});saveX();
}
function likePost(id){const p=xPosts.find(x=>x.id===id);if(p){p.likes++;saveX()}}
function renderXFeed(){
  const f=document.getElementById("x-feed");f.innerHTML="";
  xPosts.forEach(p=>{
    const d=document.createElement("div");d.className="x-card";
    const matchChar=appSettings.characters.find(c=>c.name===p.author);
    const avImg=p.author===(appSettings.userName||"自分")?appSettings.userImg:(matchChar?.img||"");
    const reps=(p.replies||[]).length?`<div class="x-replies">${p.replies.map(r=>`<div class="x-reply-item">${esc(r)}</div>`).join("")}</div>`:"";
    d.innerHTML=`${avatarHtml(avImg,p.author,38,14)}<div class="x-body-wrap"><div class="x-author-row"><span class="x-author">${esc(p.author)}</span><span class="x-time">${esc(p.time)}</span></div><div class="x-text">${esc(p.text)}</div><button class="x-action-btn" onclick="likePost(${p.id})">♡ ${p.likes}</button>${reps}</div>`;
    f.appendChild(d);
  });
}

let logEps=JSON.parse(localStorage.getItem("my_space_set_logs")||"null")||[{id:"ep1",title:"雨のソラマチと水族館デート",partner:"れお",date:"11月15日（日）",status:"おわり",scenes:[{speaker:"れお",time:"16:31",text:"暗いからな、手離すなよ"},{speaker:"自分",time:"16:31",text:"くらげ、きれい…♡"}]}];
let curEpId="ep1";
function saveLogs(){localStorage.setItem("my_space_set_logs",JSON.stringify(logEps))}
function updateSpeakerOpts(){
  const sel=document.getElementById("scene-speaker-select");if(!sel)return;sel.innerHTML="";
  appSettings.characters.forEach(c=>{const o=document.createElement("option");o.value=c.name;o.textContent=c.name;sel.appendChild(o)});
  const u=document.createElement("option");u.value=appSettings.userName||"自分";u.textContent=appSettings.userName||"自分";sel.appendChild(u);
}
function renderLogEpisodes(){
  const l=document.getElementById("log-ep-list");l.innerHTML="";
  logEps.forEach(ep=>{
    const b=document.createElement("button");b.className="log-ep-card";b.onclick=()=>openLogDetail(ep.id);
    b.innerHTML=`<div><div class="log-ep-title">${esc(ep.title)}</div><div class="log-ep-meta">${esc(ep.partner)} ・ ${esc(ep.date)}（${ep.scenes.length}シーン）</div></div><span class="log-badge">${esc(ep.status)}</span>`;
    l.appendChild(b);
  });
}
function createNewLogEpisode(){
  const title=prompt("エピソードのタイトルを入力してください","新しいお出かけログ");if(!title)return;
  const n=new Date(),dp=appSettings.characters[0]?.name||"れお";
  const ep={id:"ep_"+Date.now(),title:title.trim(),partner:dp,date:`${n.getMonth()+1}月${n.getDate()}日`,status:"進行中",scenes:[{speaker:dp,time:nowStr(),text:"待ち合わせ場所、着いたよ。"}]};
  logEps.unshift(ep);saveLogs();openLogDetail(ep.id);
}
function openLogDetail(id){
  curEpId=id;const ep=logEps.find(e=>e.id===id);if(!ep)return;
  updateSpeakerOpts();document.getElementById("log-detail-title").textContent=ep.title;document.getElementById("log-detail-sub").textContent=`${ep.partner} ・ ${ep.date}`;document.getElementById("log-status-btn").textContent=ep.status;
  openScreen("screen-log-detail");renderScenes();
}
function toggleLogStatus(){const ep=logEps.find(e=>e.id===curEpId);if(!ep)return;ep.status=ep.status==="おわり"?"進行中":"おわり";document.getElementById("log-status-btn").textContent=ep.status;saveLogs()}
function renderScenes(){
  const c=document.getElementById("scene-list");c.innerHTML="";const ep=logEps.find(e=>e.id===curEpId);if(!ep)return;
  ep.scenes.forEach(sc=>{
    const d=document.createElement("div");d.className="scene-card";
    d.innerHTML=`<div class="scene-top">${findAvatarByName(sc.speaker)}<div class="scene-speaker-name">${esc(sc.speaker)}</div></div><div class="scene-center"><div class="scene-time">${esc(sc.time)}</div><div class="scene-line">${esc(sc.text)}</div></div><div style="height:16px"></div>`;
    c.appendChild(d);
  });
  c.scrollTop=c.scrollHeight;
}
function addSceneCard(){
  const ep=logEps.find(e=>e.id===curEpId),sp=document.getElementById("scene-speaker-select").value,inp=document.getElementById("scene-input"),txt=inp.value.trim();
  if(!ep||!txt)return;ep.scenes.push({speaker:sp,time:nowStr(),text:txt});inp.value="";saveLogs();renderScenes();
}

renderTalkList();renderXFeed();renderLogEpisodes();updateSpeakerOpts();
if(xPosts.length)document.getElementById("lock-x-preview").textContent=`${xPosts[0].author}：${xPosts[0].text}`;
</script>
</body>
</html>
