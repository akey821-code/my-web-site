<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(160deg, #1b2234 0%, #2d3752 45%, #4a4063 100%);
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.22);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      padding: 44px 20px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 画面切り替え制御 */
    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
    }
    .screen.active {
      display: flex;
    }

    /* ロック画面：時計・日付 */
    .clock-area {
      text-align: center;
      margin-top: 12px;
      margin-bottom: 24px;
    }
    .date-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .time-text {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    /* ロック画面：通知・ステータス風カード */
    .widget-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .widget-body {
      font-size: 14px;
      line-height: 1.45;
    }

    /* ロック画面：アプリアイコングリッド */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 12px;
      margin-top: auto;
      padding-top: 24px;
    }
    .app-btn {
      background: none;
      border: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .app-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: transform 0.12s ease;
    }
    .app-btn:active .app-icon {
      transform: scale(0.92);
    }
    .app-label {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* サブ画面共通（LINE / X / set log） */
    .sub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 16px;
    }
    .back-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    .sub-title {
      font-size: 16px;
      font-weight: 700;
    }
    .placeholder-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="phone-frame">

    <!-- 1. ロック画面（ホームハブ） -->
    <div id="screen-lock" class="screen active">
      <div>
        <div class="clock-area">
          <div id="date-display" class="date-text">11月20日 金曜日</div>
          <div id="time-display" class="time-text">09:00</div>
        </div>

        <div class="widget-card">
          <div class="widget-header">
            <span>💬 LINE ・ たった今</span>
            <span>れお</span>
          </div>
          <div class="widget-body">
            おはよ。今日も無理しすぎないようにね。
          </div>
        </div>

        <div class="widget-card">
          <div class="widget-header">
            <span>𝕏 タイムライン</span>
            <span>新着あり</span>
          </div>
          <div class="widget-body">
            最近のつぶやきや巡回ログがここに表示されます。
          </div>
        </div>
      </div>

      <div class="app-grid">
        <button class="app-btn" onclick="openScreen('screen-line')">
          <div class="app-icon">💬</div>
          <span class="app-label">LINE</span>
        </button>
        <button class="app-btn" onclick="openScreen('screen-x')">
          <div class="app-icon">𝕏</div>
          <span class="app-label">X</span>
        </button>
        <button class="app-btn" onclick="openScreen('screen-log')">
          <div class="app-icon">📓</div>
          <span class="app-label">set log</span>
        </button>
        <button class="app-btn" onclick="openScreen('screen-settings')">
          <div class="app-icon">⚙️</div>
          <span class="app-label">設定</span>
        </button>
      </div>
    </div>

    <!-- 2. LINE風画面 -->
    <div id="screen-line" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">LINE</div>
        <div style="width: 72px;"></div>
      </div>
      <div class="placeholder-box">
        ここにトーク一覧やメッセージ画面を作っていきます。
      </div>
    </div>

    <!-- 3. X風画面 -->
    <div id="screen-x" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">タイムライン</div>
        <div style="width: 72px;"></div>
      </div>
      <div class="placeholder-box">
        ここにキャラクターたちのつぶやき・リプ欄を作っていきます。
      </div>
    </div>

    <!-- 4. set log画面 -->
    <div id="screen-log" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">set log</div>
        <div style="width: 72px;"></div>
      </div>
      <div class="placeholder-box">
        ここに設定や記録のログ画面を作っていきます。
      </div>
    </div>

    <!-- 5. 設定画面 -->
    <div id="screen-settings" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">設定</div>
        <div style="width: 72px;"></div>
      </div>
      <div class="placeholder-box">
        ここにプロンプト設定や壁紙・API設定などを置いていきます。
      </div>
    </div>

  </div>

  <script>
    // 時計と日付をリアルタイム更新
    function updateClock() {
      const now = new Date();
      const days = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayName = days[now.getDay()];
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");

      document.getElementById("date-display").textContent = `${month}月${date}日 ${dayName}`;
      document.getElementById("time-display").textContent = `${hours}:${minutes}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // 画面切り替え関数
    function openScreen(screenId) {
      document.querySelectorAll(".screen").forEach((el) => {
        el.classList.remove("active");
      });
      document.getElementById(screenId).classList.add("active");
    }
  </script>
</body>
</html>
