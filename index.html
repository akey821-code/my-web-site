<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(160deg, #1b2234 0%, #2d3752 45%, #4a4063 100%);
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.22);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      padding: 44px 20px 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 画面切り替え制御 */
    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }
    .screen.active {
      display: flex;
    }

    /* ロック画面：時計・日付 */
    .clock-area {
      text-align: center;
      margin-top: 12px;
      margin-bottom: 24px;
    }
    .date-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .time-text {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    /* ロック画面：通知カード */
    .widget-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .widget-body {
      font-size: 14px;
      line-height: 1.45;
    }

    /* ロック画面：アプリアイコングリッド */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 12px;
      margin-top: auto;
      padding-top: 24px;
    }
    .app-btn {
      background: none;
      border: none;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .app-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: transform 0.12s ease;
    }
    .app-btn:active .app-icon {
      transform: scale(0.92);
    }
    .app-label {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* サブ画面共通ヘッダー */
    .sub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .back-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    .sub-title {
      font-size: 16px;
      font-weight: 700;
    }
    .placeholder-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* LINE：トーク一覧 */
    .talk-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .talk-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      color: var(--text-main);
      width: 100%;
    }
    .talk-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    .talk-info {
      flex: 1;
      min-width: 0;
    }
    .talk-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .talk-name {
      font-size: 15px;
      font-weight: 700;
    }
    .talk-time {
      font-size: 11px;
      color: var(--text-sub);
    }
    .talk-preview {
      font-size: 13px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* LINE：個別トーク（吹き出しエリア） */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 2px 12px;
    }
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }
    .msg-row.partner {
      align-self: flex-start;
    }
    .msg-row.me {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-row.partner .msg-bubble {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid var(--glass-border);
      border-top-left-radius: 4px;
    }
    .msg-row.me .msg-bubble {
      background: rgba(120, 210, 160, 0.35);
      border: 1px solid rgba(150, 240, 190, 0.45);
      border-top-right-radius: 4px;
    }
    .msg-meta {
      font-size: 10px;
      color: var(--text-sub);
      margin-top: 3px;
      padding: 0 4px;
    }

    /* LINE：下部入力欄 */
    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 10px 16px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
    }
    .chat-input::placeholder {
      color: var(--text-sub);
    }
    .send-btn {
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-radius: 999px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .send-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="phone-frame">

    <!-- 1. ロック画面（ホームハブ） -->
    <div id="screen-lock" class="screen active">
      <div>
        <div class="clock-area">
          <div id="date-display" class="date-text">11月20日 金曜日</div>
          <div id="time-display" class="time-text">09:00</div>
        </div>

        <div class="widget-card" onclick="openChat('leo')">
          <div class="widget-header">
            <span>💬 LINE ・ たった今</span>
            <span>れお</span>
          </div>
          <div id="lock-line-preview" class="widget-body">
            おはよ。今日も無理しすぎないようにね。
          </div>
        </div>

        <div class="widget-card" onclick="openScreen('screen-x')">
          <div class="widget-header">
            <span>𝕏 タイムライン</span>
            <span>新着あり</span>
          </div>
          <div class="widget-body">
            最近のつぶやきや巡回ログがここに表示されます。
          </div>
        </div>
      </div>

      <div class="app-grid">
        <button class="app-btn" onclick="openScreen('screen-line-list')">
          <div class="app-icon">💬</div>
          <span class="app-label">LINE</span>
        </button>
        <button class="app-btn" onclick="openScreen('screen-x')">
          <div class="app-icon">𝕏</div>
          <span class="app-label">X</span>
        </button>
        <button class="app-btn" onclick="openScreen('screen-log')">
          <div class="app-icon">📓</div>
          <span class="app-label">set log</span>
        </button>
        <button class="app-btn" onclick="openScreen('screen-settings')">
          <div class="app-icon">⚙️</div>
          <span class="app-label">設定</span>
        </button>
      </div>
    </div>

    <!-- 2-A. LINE：トーク一覧画面 -->
    <div id="screen-line-list" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">トーク</div>
        <div style="width: 72px;"></div>
      </div>

      <div id="talk-list-container" class="talk-list">
        <!-- JSで一覧を描画 -->
      </div>
    </div>

    <!-- 2-B. LINE：個別チャット画面 -->
    <div id="screen-line-chat" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-line-list')">← 一覧</button>
        <div id="chat-partner-name" class="sub-title">れお</div>
        <button class="back-btn" onclick="clearCurrentChat()" style="font-size: 11px;">履歴消去</button>
      </div>

      <div id="chat-messages" class="chat-messages">
        <!-- JSで吹き出しを描画 -->
      </div>

      <div class="chat-input-bar">
        <input
          id="chat-input"
          class="chat-input"
          type="text"
          placeholder="メッセージを入力..."
          onkeydown="if(event.key==='Enter') sendMessage()"
        />
        <button class="send-btn" onclick="sendMessage()">送信</button>
      </div>
    </div>

    <!-- 3. X風画面 -->
    <div id="screen-x" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">タイムライン</div>
        <div style="width: 72px;"></div>
      </div>
      <div class="placeholder-box">
        ここにキャラクターたちのつぶやき・リプ欄を作っていきます。
      </div>
    </div>

    <!-- 4. set log画面 -->
    <div id="screen-log" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">set log</div>
        <div style="width: 72px;"></div>
      </div>
      <div class="placeholder-box">
        ここに設定や記録のログ画面を作っていきます。
      </div>
    </div>

    <!-- 5. 設定画面 -->
    <div id="screen-settings" class="screen">
      <div class="sub-header">
        <button class="back-btn" onclick="openScreen('screen-lock')">← ロック画面</button>
        <div class="sub-title">設定</div>
        <div style="width: 72px;"></div>
      </div>
      <div class="placeholder-box">
        ここにプロンプト設定や壁紙・API設定などを置いていきます。
      </div>
    </div>

  </div>

  <script>
    // 時計と日付をリアルタイム更新
    function updateClock() {
      const now = new Date();
      const days = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayName = days[now.getDay()];
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");

      document.getElementById("date-display").textContent = `${month}月${date}日 ${dayName}`;
      document.getElementById("time-display").textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // キャラクター定義（仮データ・あとで追加編集可能）
    const characters = {
      leo: {
        name: "れお",
        icon: "れ",
        initialMessage: "おはよ。今日も無理しすぎないようにね。"
      },
      sub1: {
        name: "キャラB（仮）",
        icon: "B",
        initialMessage: "テスト用のトーク枠だよ。"
      }
    };

    let currentPartnerId = "leo";
    let chatData = JSON.parse(localStorage.getItem("my_space_line_chats") || "null") || {
      leo: [{ sender: "partner", text: characters.leo.initialMessage, time: "09:00" }],
      sub1: [{ sender: "partner", text: characters.sub1.initialMessage, time: "08:30" }]
    };

    function saveChats() {
      localStorage.setItem("my_space_line_chats", JSON.stringify(chatData));
      renderTalkList();
    }

    function getCurrentTimeStr() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    }

    // 画面切り替え
    function openScreen(screenId) {
      document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
      document.getElementById(screenId).classList.add("active");
      if (screenId === "screen-line-list") {
        renderTalkList();
      }
    }

    // トーク一覧を描画
    function renderTalkList() {
      const container = document.getElementById("talk-list-container");
      container.innerHTML = "";

      Object.keys(characters).forEach((id) => {
        const char = characters[id];
        const msgs = chatData[id] || [];
        const lastMsg = msgs[msgs.length - 1];

        const btn = document.createElement("button");
        btn.className = "talk-item";
        btn.onclick = () => openChat(id);
        btn.innerHTML = `
          <div class="talk-avatar">${char.icon}</div>
          <div class="talk-info">
            <div class="talk-top">
              <span class="talk-name">${char.name}</span>
              <span class="talk-time">${lastMsg ? lastMsg.time : ""}</span>
            </div>
            <div class="talk-preview">${lastMsg ? lastMsg.text : ""}</div>
          </div>
        `;
        container.appendChild(btn);
      });

      // ロック画面の最新プレビューも同期
      const leoMsgs = chatData.leo || [];
      if (leoMsgs.length > 0) {
        document.getElementById("lock-line-preview").textContent = leoMsgs[leoMsgs.length - 1].text;
      }
    }

    // 個別トーク画面を開く
    function openChat(partnerId) {
      currentPartnerId = partnerId;
      document.getElementById("chat-partner-name").textContent = characters[partnerId].name;
      openScreen("screen-line-chat");
      renderMessages();
    }

    // 吹き出しを描画
    function renderMessages() {
      const box = document.getElementById("chat-messages");
      box.innerHTML = "";
      const msgs = chatData[currentPartnerId] || [];

      msgs.forEach((m) => {
        const row = document.createElement("div");
        row.className = `msg-row ${m.sender}`;
        row.innerHTML = `
          <div class="msg-bubble">${escapeHtml(m.text)}</div>
          <div class="msg-meta">${m.time}</div>
        `;
        box.appendChild(row);
      });

      box.scrollTop = box.scrollHeight;
    }

    // メッセージ送信（今は仮のダミー返信、次の段階でAI APIに差し替え）
    function sendMessage() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;

      const timeStr = getCurrentTimeStr();
      if (!chatData[currentPartnerId]) chatData[currentPartnerId] = [];
      chatData[currentPartnerId].push({ sender: "me", text, time: timeStr });
      input.value = "";
      saveChats();
      renderMessages();

      // 仮の自動返信テスト（API接続前の動作確認用）
      const targetId = currentPartnerId;
      setTimeout(() => {
        const replyText = `（仮返信）『${text}』受け取ったよ！`;
        chatData[targetId].push({ sender: "partner", text: replyText, time: getCurrentTimeStr() });
        saveChats();
        if (currentPartnerId === targetId) {
          renderMessages();
        }
      }, 700);
    }

    function clearCurrentChat() {
      const char = characters[currentPartnerId];
      chatData[currentPartnerId] = [
        { sender: "partner", text: char.initialMessage, time: getCurrentTimeStr() }
      ];
      saveChats();
      renderMessages();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    renderTalkList();
  </script>
</body>
</html>
